# Copy this file to config.yaml and edit locally. Never commit config.yaml.
# Keep the example disabled; copying it must not activate a provider call.
# After a reviewed offline setup, set enabled: true only in the ignored local file.
# The default route is the official TypeSafe API. For the separately labeled
# Experiential Labs native route, set provider: experientiallabs_native and use
# base_url: https://api.experientiallabs.ai plus
# credential_env: HERMES_CUSTOM_API_EXPERIENTIALLABS_AI_API_KEY.
# Kill switch: enabled: false, or include "bypass jev" / "no jev" in the request state.
enabled: false
model: jev-latest   # jev-latest | jev-preview (preview for shadow-testing new packs)
provider: typesafe_official
base_url: https://api.typesafe.ai
credential_env: TYPESAFE_API_KEY
timeout: 5.0
max_retries: 1

# The native Experiential Labs route is explicit and separately labeled. It is
# not an activation source; configure it only in an ignored local config after
# review and credential setup.

# shadow logs advice and the agent acts on normal judgment;
# active requires the agent/skill to honor route.action.
mode: shadow  # shadow | active

# Confidence guidance is documented in docs/policy.md. These are not router
# settings; the implemented router controls are under thresholds/limits.

thresholds:
  min_choice_confidence: 0.55  # below: choice winner not trusted -> proceed_full
  reuse_min: 0.65              # noul P(yes) to reuse a cached artifact
  subagent_min: 0.75           # noul P(yes) to spawn a specialist subagent
  stop_retry_min: 0.55         # noul P(yes) to stop a repeated failing approach

limits:
  max_browser_sources: 5
  max_retries_same_error: 1

logging:
  path: logs/runs.jsonl
